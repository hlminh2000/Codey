name: Build and Upload
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install Bun
        run: npm i -g bun
      - name: Install dependencies
        run: bun install
      - name: Build project
        run: bun build --compile index.ts
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: index
